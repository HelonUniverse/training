# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# Before running on a device, set DEVELOPMENT_TEAM and, if you use your own
# identifiers, BUNDLE_ID_PREFIX / APP_GROUP_IDENTIFIER below.
name: AIGamingCoach

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_PREFIX: com.heloniuminnovation.aigamingcoach
    APP_GROUP_IDENTIFIER: group.com.heloniuminnovation.aigamingcoach
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  CoachKit:
    path: Packages/CoachKit

targets:
  AIGamingCoach:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CoachKit
        product: CoachCore
      - target: BroadcastExtension
        embed: true
        codeSign: true
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: AIGamingCoach
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CoachAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        CoachBroadcastExtensionBundleIdentifier: $(BUNDLE_ID_PREFIX).broadcast
    entitlements:
      path: App/AIGamingCoach.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    dependencies:
      - package: CoachKit
        product: CoachCore
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).broadcast
        PRODUCT_NAME: BroadcastExtension
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BroadcastExtension/Info.plist
      properties:
        # Name shown in the system broadcast picker.
        CFBundleDisplayName: AI Gaming Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CoachAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)

schemes:
  AIGamingCoach:
    build:
      targets:
        AIGamingCoach: all
        BroadcastExtension: all
    run:
      config: Debug
