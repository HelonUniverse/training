# XcodeGen spec for AIGamingCoach.xcodeproj.
#
# The generated project IS committed, so installing on an iPhone needs
# only Xcode (see INSTALL_ON_IPHONE.md). After editing this file, run
# `xcodegen generate` and commit the regenerated project; CI fails if the
# two drift apart.
#
# Signing: pick your Team in Xcode (Signing & Capabilities) for both
# targets. No team is stored here.
#
# Identifiers are literal on purpose: Xcode's automatic signing registers
# the App IDs and the App Group exactly as written. They appear in:
#   app bundle ID          com.heloniuminnovation.aigamingcoach
#   extension bundle ID    com.heloniuminnovation.aigamingcoach.broadcast
#   App Group              group.com.heloniuminnovation.aigamingcoach
name: AIGamingCoach

options:
  # Stops Xcode 26/27 from offering "Update to recommended settings".
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  CoachKit:
    path: Packages/CoachKit

targets:
  AIGamingCoach:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # Media components shared with the extension (rolling-buffer encoder,
      # keyframes, frame probe), used by the in-app ScreenCaptureKit provider.
      - path: BroadcastExtension/SegmentWriter.swift
      - path: BroadcastExtension/KeyframeEncoder.swift
    dependencies:
      - package: CoachKit
        product: CoachCore
      - target: BroadcastExtension
        embed: true
        codeSign: true
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heloniuminnovation.aigamingcoach
        PRODUCT_NAME: AIGamingCoach
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CoachAppGroupIdentifier: group.com.heloniuminnovation.aigamingcoach
        CoachBroadcastExtensionBundleIdentifier: com.heloniuminnovation.aigamingcoach.broadcast
        # ScreenCaptureKit (iOS 27+): keeps full-display capture running while
        # another app is in front. Older iOS versions ignore this value.
        UIBackgroundModes:
          - screen-capture
        NSScreenCaptureUsageDescription: AI Gaming Coach analyses the gameplay you choose to share so it can coach you. Nothing is captured until you confirm in the system screen-sharing sheet.
    entitlements:
      path: App/AIGamingCoach.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heloniuminnovation.aigamingcoach

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    dependencies:
      - package: CoachKit
        product: CoachCore
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heloniuminnovation.aigamingcoach.broadcast
        PRODUCT_NAME: BroadcastExtension
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BroadcastExtension/Info.plist
      properties:
        # Name shown in the system broadcast picker.
        CFBundleDisplayName: AI Gaming Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CoachAppGroupIdentifier: group.com.heloniuminnovation.aigamingcoach
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heloniuminnovation.aigamingcoach

schemes:
  AIGamingCoach:
    build:
      targets:
        AIGamingCoach: all
        BroadcastExtension: all
    run:
      config: Debug
